<section class="contact-section text-center mb-5 py-5">
  <div class="container">
    <h2 class="mb-4 fw-bold">CONTACT ME</h2>
    <div class="divider d-flex align-items-center justify-content-center mb-4">
      <div class="line me-3"></div>
      <i class="fa-solid fa-star"></i>
      <div class="line ms-3"></div>
    </div>

    <form class="mx-auto" style="max-width: 600px;">
      <div class="form-group mb-3">
        <input type="text" class="form-control" placeholder="userName" />
      </div>

      <div class="form-group mb-3">
        <input type="number" class="form-control" placeholder="userAge" />
      </div>

      <div class="form-group mb-3">
        <input type="email" class="form-control" placeholder="userEmail" />
      </div>

      <div class="form-group mb-4">
        <input type="password" class="form-control" placeholder="userPassword" />
      </div>

      <button type="submit" class="btn btn-success px-4">Send Message</button>
    </form>
  </div>
</section>
